<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Projetos de radji.">
  <title>radji. — projetos</title>
  <link rel="preload" href="/poppins-800.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face {
      font-family: "Poppins Local";
      src: url("/poppins-800.ttf") format("truetype");
      font-style: normal;
      font-weight: 800;
      font-display: block;
    }

    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; color: #111; }
    body { overflow-x: hidden; }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }
    .projects {
      width: min(100%, 440px);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      gap: clamp(20px, 5vw, 40px);
    }
    .projectBubble {
      display: grid;
      place-items: center;
      width: clamp(154px, 36vw, 190px);
      aspect-ratio: 1;
      border-radius: 50%;
      background: #0a0a0a;
      color: #fff;
      text-decoration: none;
      transition: transform .18s ease, background-color .18s ease;
      animation: arrive 600ms cubic-bezier(.22, 1, .36, 1) both;
      -webkit-tap-highlight-color: transparent;
    }
    .projectLogo {
      font-family: "Poppins Local", "Arial Black", sans-serif;
      font-size: clamp(28px, 7vw, 36px);
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.07em;
      white-space: nowrap;
      transform: translateX(-.03em);
    }
    .projectBubble:hover { background: #000; }
    .projectBubble:active { transform: scale(.965); }
    .projectBubble:focus-visible { outline: 3px solid #111; outline-offset: 8px; }
    @keyframes arrive {
      from { opacity: 0; transform: scale(.94); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .projectBubble { animation: none; transition: none; }
    }
  </style>
</head>
<body>
  <main>
    <nav class="projects" aria-label="Projetos de Radji">
      <a class="projectBubble" href="/bolsa" aria-label="Abrir o projeto bls².i">
        <span class="projectLogo" aria-hidden="true">bls².i</span>
      </a>
      <a class="projectBubble" href="https://junks-pedidos.radji-schucman.chatgpt.site" aria-label="Abrir o catálogo Junckes">
        <span class="projectLogo" aria-hidden="true">Junckes</span>
      </a>
    </nav>
  </main>
</body>
</html>
