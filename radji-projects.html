<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="description" content="Projetos de radji.">
  <title>radji. — projetos</title>
  <link rel="preload" href="/poppins-800.ttf" as="font" type="font/ttf" crossorigin>
  <style>
    @font-face {
      font-family: "Poppins Local";
      src: url("/poppins-800.ttf") format("truetype");
      font-style: normal;
      font-weight: 800;
      font-display: block;
    }

    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #fff; color: #111; }
    body { overflow-x: hidden; }
    main {
      min-height: 100vh;
      min-height: 100svh;
      display: grid;
      place-items: center;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
    }
    .projects {
      width: min(100%, 720px);
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      align-items: center;
      gap: 32px 48px;
    }
    .projectLink {
      display: grid;
      place-items: center;
      min-width: 0;
      min-height: 200px;
      padding: 16px 8px;
      border-radius: 12px;
      color: #0a0a0a;
      text-decoration: none;
      transition: transform .18s ease;
      animation: arrive 600ms cubic-bezier(.22, 1, .36, 1) both;
      -webkit-tap-highlight-color: transparent;
    }
    .projectLink img { display: block; max-width: 100%; height: auto; object-fit: contain; }
    .blsLogo {
      font-family: "Poppins Local", "Arial Black", sans-serif;
      font-size: 64px;
      font-weight: 800;
      line-height: 1;
      letter-spacing: -.07em;
      white-space: nowrap;
    }
    .junckesLogo { width: 164px; }
    .nossoLogo { display: inline-flex; align-items: center; gap: 9px; }
    .nossoLogo img { width: 56px; height: 56px; }
    .nossoWordmark {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 40px;
      font-weight: 750;
      line-height: 1;
      letter-spacing: -.065em;
      color: #9f392d;
      white-space: nowrap;
    }
    .politiquesLogo { width: 300px; }
    .projectLink:active { transform: scale(.975); }
    .projectLink:focus-visible { outline: 3px solid #111; outline-offset: 6px; }
    @media (hover: hover) { .projectLink:hover { transform: scale(1.035); } }
    @media (max-width: 600px) {
      .projects { width: min(100%, 320px); grid-template-columns: minmax(0, 1fr); gap: 16px; }
      .projectLink { min-height: 132px; padding: 8px; }
      .junckesLogo { width: 144px; }
      .politiquesLogo { width: min(300px, 100%); }
    }
    @keyframes arrive {
      from { opacity: 0; transform: scale(.94); }
      to { opacity: 1; transform: scale(1); }
    }
    @media (prefers-reduced-motion: reduce) {
      .projectLink { animation: none; transition: none; }
      .projectLink:hover, .projectLink:active { transform: none; }
    }
  </style>
</head>
<body>
  <main>
    <nav class="projects" aria-label="Projetos de Radji">
      <a class="projectLink" href="/bolsa" aria-label="Abrir o projeto bls².i">
        <span class="blsLogo" aria-hidden="true">bls².i</span>
      </a>
      <a class="projectLink" href="https://junks-pedidos.radji-schucman.chatgpt.site" aria-label="Abrir o catálogo Junckes">
        <img class="junckesLogo" src="/project-logos/junckes.jpg" alt="" width="1536" height="1419" decoding="async">
      </a>
      <a class="projectLink" href="https://nosso-radji.radji-schucman.chatgpt.site" aria-label="Abrir o nosso.app">
        <span class="nossoLogo" aria-hidden="true"><img src="/project-logos/nosso.png" alt="" width="192" height="192" decoding="async"><span class="nossoWordmark">nosso.app</span></span>
      </a>
      <a class="projectLink" href="https://politilingo.radji-schucman.chatgpt.site" aria-label="Abrir o Politiquês, aprenda política com a Póli" title="Aprenda política com a Póli, em lições curtas.">
        <img class="politiquesLogo" src="/project-logos/politiques.webp" alt="" width="1600" height="533" decoding="async">
      </a>
    </nav>
  </main>
</body>
</html>
