<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>Ações Tóquio</title>
<style>
:root{--bg:#fff;--text:#111;--muted:#8b8f96;--line:#eceef1;--green:#22b35f;--soft:#f7f8fa}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
body{min-height:100vh}
.app{max-width:680px;margin:0 auto;min-height:100vh;padding:calc(28px + env(safe-area-inset-top)) 22px calc(96px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
h1{margin:0;font-size:42px;line-height:1;letter-spacing:-1.5px;font-weight:700}
.profile{width:34px;height:34px;border:1.7px solid #111;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px}
.status{display:flex;align-items:center;gap:9px;margin-top:14px;font-size:15px;color:#333;flex-wrap:wrap}
.dot{width:10px;height:10px;border-radius:50%;background:var(--green);box-shadow:0 0 0 4px rgba(34,179,95,.08)}
.muted{color:var(--muted)}
.sep{color:#c8cbd0}
.marketTabs{margin-top:24px;padding:4px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--soft);border:1px solid #e7e9ed;border-radius:14px}
.marketTabs button{height:42px;border:0;border-radius:10px;background:transparent;color:#767b82;font-size:14px;font-weight:600;cursor:pointer;white-space:nowrap;padding:0 5px}
.marketTabs button.active{background:#111;color:#fff;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.marketTabs button.active::before{content:"✓";margin-right:5px}
.marketTabs button:nth-child(7){grid-column:2}
.search{margin-top:14px;background:var(--soft);border:1px solid #e7e9ed;border-radius:16px;padding:0 16px;height:56px;display:flex;align-items:center;gap:12px}
.search span{font-size:22px;color:#7d8289}
.search input{border:0;outline:0;background:transparent;width:100%;font-size:18px;color:#111}
.search input::placeholder{color:#a1a5ab}
.list{margin-top:30px}
.row{display:grid;grid-template-columns:1fr auto;gap:18px;align-items:center;min-height:84px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}
.name{font-size:22px;letter-spacing:-.2px}
.ticker{font-size:12px;color:var(--muted);margin-top:4px}
.price{font-size:22px;letter-spacing:-.2px;text-align:right;white-space:nowrap;display:flex;align-items:center;justify-content:flex-end;gap:8px}
.move{font-size:16px;font-weight:700;min-width:16px;text-align:center}
.move.up{color:#22b35f}
.move.down{color:#d94b4b}
.move.flat{color:#9aa0a6}
.loading{color:#9aa0a6}
.error{color:#b24a4a}
.detailBack{display:inline-flex;align-items:center;gap:8px;border:0;background:transparent;padding:0;margin:6px 0 28px;font-size:15px;color:#555;cursor:pointer}
.detailCard{padding:26px 0 10px}
.detailName{font-size:34px;line-height:1.05;letter-spacing:-1px;font-weight:700}
.detailTicker{font-size:14px;color:var(--muted);margin-top:8px}
.detailPrice{font-size:54px;line-height:1;letter-spacing:-2px;margin-top:34px;display:flex;align-items:center;gap:14px}
.detailPrice .move{font-size:26px}
.soundHint{margin-top:28px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;font-size:14px;color:#555;cursor:pointer;background:#fafafa}
.soundHint.active{color:#1b7f48;background:#f4fbf7}
.mainSoundHint{margin-top:14px;padding:11px 14px;border:1px solid var(--line);border-radius:12px;font-size:13px;color:#555;background:#fafafa;cursor:pointer}
.mainSoundHint.active{color:#1b7f48;background:#f4fbf7}
.soundPicker{margin-top:10px;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff}
.soundPickerHead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:9px;font-size:12px;color:var(--muted)}
.soundPickerHead strong{font-size:13px;color:#333}
.soundOptions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.soundOption{min-height:54px;border:1px solid #e5e7eb;border-radius:10px;background:var(--soft);color:#555;padding:8px 7px;cursor:pointer;text-align:left}
.soundOption span,.soundOption small{display:block}
.soundOption span{font-size:13px;font-weight:700;color:#333}
.soundOption small{margin-top:3px;font-size:10px;line-height:1.2;color:#8b8f96}
.soundOption.active{border-color:#111;background:#111;box-shadow:0 1px 4px rgba(0,0,0,.14)}
.soundOption.active span{color:#fff}
.soundOption.active small{color:#c9cbd0}
.soundOption:focus-visible{outline:3px solid rgba(34,179,95,.22);outline-offset:2px}
.detailMeta{margin-top:18px;font-size:13px;line-height:1.6;color:var(--muted)}
.foot{margin-top:24px;font-size:12px;line-height:1.5;color:var(--muted)}
.refresh{margin-left:auto;border:0;background:transparent;color:#555;font-size:13px;padding:6px 0;cursor:pointer}
.nav{position:fixed;left:0;right:0;bottom:0;background:rgba(255,255,255,.96);backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom));display:flex;justify-content:center}
.navin{width:min(680px,100%);display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{border:0;background:transparent;padding:7px 4px;color:#9a9ea4;font-size:12px}
.nav button b{display:block;font-size:21px;line-height:1.1;margin-bottom:4px;font-weight:500}
.nav button.active{color:#111}
.toast{position:fixed;left:50%;bottom:92px;transform:translateX(-50%) translateY(10px);background:#111;color:white;border-radius:999px;padding:10px 14px;font-size:12px;opacity:0;pointer-events:none;transition:.2s;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media (min-width:700px){
  .app{padding-top:48px}
  h1{font-size:48px}
  .row{min-height:90px}
}
@media (max-width:430px){
  .marketTabs button{font-size:12px;padding:0 2px}
  .soundOption{padding:8px 5px}
  .soundOption span{font-size:12px}
}
</style>
</head>
<body>
<main class="app">
  <div class="top">
    <div>
      <h1 id="pageTitle">Ações Tóquio</h1>
      <div class="status">
        <span class="dot"></span>
        <strong>Atualização automática</strong>
        <span class="sep">|</span>
        <span class="muted" id="updated">carregando...</span>
        <button class="refresh" id="refresh">Atualizar</button>
      </div>
    </div>
    <div class="profile" aria-label="perfil">○</div>
  </div>

  <div class="marketTabs" id="marketTabs" role="group" aria-label="Bolsas; escolha uma ou mais">
    <button class="active" type="button" aria-pressed="true" data-market="tokyo">Tóquio</button>
    <button type="button" aria-pressed="false" data-market="bovespa">Bovespa</button>
    <button type="button" aria-pressed="false" data-market="frankfurt">Frankfurt</button>
    <button type="button" aria-pressed="false" data-market="madrid">Madrid</button>
    <button type="button" aria-pressed="false" data-market="paris">Paris</button>
    <button type="button" aria-pressed="false" data-market="london">Londres</button>
    <button type="button" aria-pressed="false" data-market="newyork">Nova York</button>
  </div>

  <label class="search">
    <span>⌕</span>
    <input id="search" placeholder="Buscar ações..." autocomplete="off">
  </label>
  <div class="mainSoundHint" id="mainSoundHint">🔊 Toque aqui uma vez para ativar os sons das 30 ações</div>
  <section class="soundPicker" id="soundPicker" aria-label="Tipo de som">
    <div class="soundPickerHead"><strong>Tipo de som</strong><span>Toque para ouvir</span></div>
    <div class="soundOptions" role="group" aria-label="Escolha o tipo de som">
      <button class="soundOption active" type="button" aria-pressed="true" data-sound-preset="classic"><span>Clássico</span><small>queda mais forte</small></button>
      <button class="soundOption" type="button" aria-pressed="false" data-sound-preset="waves"><span>Ondas</span><small>suave e contínuo</small></button>
      <button class="soundOption" type="button" aria-pressed="false" data-sound-preset="moog"><span>Moog</span><small>tecla eletrônica</small></button>
    </div>
  </section>

  <section class="list" id="list"></section>

  <div class="foot" id="foot">
    Dados públicos de mercado da Bolsa de Tóquio; podem ter atraso em relação ao pregão. Esta tela atualiza automaticamente a cada 10 segundos.
  </div>
</main>

<nav class="nav">
  <div class="navin">
    <button class="active" data-tab="inicio"><b>⌂</b>Início</button>
    <button data-tab="favoritos"><b>☆</b>Favoritos</button>
    <button data-tab="config"><b>⚙</b>Configurações</button>
  </div>
</nav>

<div class="toast" id="toast"></div>

  classic:{label:"Clássico"},

  moog:{label:"Moog"}
};
const pathParts = location.pathname.split("/").filter(Boolean);

  "acoes-nz":"tokyo",
  "acoes-tokyo":"tokyo",
  "acoes-bovespa":"bovespa",
  "acoes-frankfurt":"frankfurt",
  "acoes-madrid":"madrid",
  "acoes-paris":"paris",
  "acoes-londres":"london",
  "acoes-nova-york":"newyork"
};
const MARKET_KEYS = Object.keys(MARKETS);
const initialMarket = PATH_MARKETS[pathParts[0]] || "tokyo";
const detailTicker = PATH_MARKETS[pathParts[0]] && pathParts[1] ? pathParts[1].toUpperCase() : null;

function selectionFromUrl(fallbackMarket){
  const params = new URLSearchParams(location.search);
  if(!params.has("bolsas")) return [fallbackMarket];
  const requested = (params.get("bolsas") || "").split(",").filter(function(key){ return MARKETS[key]; });
  return MARKET_KEYS.filter(function(key){ return requested.indexOf(key) !== -1; });
}

function storedSoundPreset(){
  try{
    const saved = localStorage.getItem(SOUND_STORAGE_KEY);
    return SOUND_PRESETS[saved] ? saved : "classic";
  }catch(e){
    return "classic";
  }
}

const state = {
  market:initialMarket,
  selectedMarkets:selectionFromUrl(initialMarket),
  quotes:{},
  previous:{},
  movements:{},
  tab:"inicio",
  filter:"",
  audioReady:false,
  audioCtx:null,
  soundPreset:storedSoundPreset(),
  soundTimers:[],
  soundPreviewTimers:[],
  soundPreviewResumeTimer:null,
  soundCycleTimer:null,
  requestSerial:0
};
if(!detailTicker && state.selectedMarkets.length) state.market = state.selectedMarkets[0];
const list = document.getElementById("list");
const updated = document.getElementById("updated");
const toast = document.getElementById("toast");

function currentMarket(){
  return MARKETS[state.market];
}

function selectedMarketKeys(){
  return MARKET_KEYS.filter(function(key){ return state.selectedMarkets.indexOf(key) !== -1; });
}

function mixedStocks(keys){
  const marketKeys = (keys || selectedMarketKeys()).filter(function(key){ return MARKETS[key]; });
  const maxStocks = marketKeys.reduce(function(max,key){
    return Math.max(max,MARKETS[key].stocks.length);
  },0);
  const mixed = [];
  for(let index=0;index<maxStocks;index += 1){
    marketKeys.forEach(function(marketKey){
      const stock = MARKETS[marketKey].stocks[index];
      if(stock) mixed.push({ticker:stock.ticker,name:stock.name,marketKey:marketKey});
    });
  }
  return mixed;
}

function stockKey(marketKey,ticker){
  return marketKey + ":" + ticker;
}

function soundSpacingMs(stockCount){
  return stockCount > 0 ? SOUND_CYCLE_MS / stockCount : 0;
}

function selectionSuffix(keys){
  if(keys.length === 1) return "";
  return "?bolsas=" + encodeURIComponent(keys.join(","));
}

function updateSelectionUrl(){
  const keys = selectedMarketKeys();
  const anchor = keys[0] || state.market || "tokyo";
  history.pushState(null,"",MARKETS[anchor].basePath + selectionSuffix(keys));
}

function showToast(msg){
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(function(){toast.classList.remove("show")},1600);
}

function unlockAudio(){
  if(state.audioReady){
    if(state.audioCtx && state.audioCtx.state === "suspended") state.audioCtx.resume();
    return true;
  }
  try{
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if(!Ctx) return;
    state.audioCtx = state.audioCtx || new Ctx();
    if(state.audioCtx.state === "suspended") state.audioCtx.resume();
    state.audioReady = true;
    startMainSoundCycle();
    render();
    showToast("Som ativado");
    return true;
  }catch(e){
    return false;
  }
}

function densityScale(maxDuration){
  if(typeof maxDuration !== "number") return 1;
  return Math.max(0.34,Math.min(1,maxDuration / 0.24));
}

function playClassicSound(ctx,direction,maxDuration){
  const now = ctx.currentTime;
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  const frequency = direction === "up" ? 980 : direction === "down" ? 165 : 430;
  const baseDuration = direction === "down" ? 0.23 : 0.12;
  const duration = typeof maxDuration === "number"
    ? Math.max(0.025,Math.min(baseDuration,maxDuration))
    : baseDuration;
  const volume = (direction === "up" ? 0.22 : direction === "down" ? 0.36 : 0.18) * densityScale(maxDuration);

  osc.type = "sine";
  osc.frequency.setValueAtTime(frequency,now);
  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(volume,now + 0.012);
  gain.gain.exponentialRampToValueAtTime(0.0001,now + duration);
  osc.connect(gain);
  gain.connect(ctx.destination);
  osc.start(now);
  osc.stop(now + duration + 0.01);
}

function playWaveSound(ctx,direction,maxDuration){
  const now = ctx.currentTime;
  const duration = typeof maxDuration === "number"
    ? Math.max(0.38,Math.min(0.82,maxDuration * 3.2))
    : 0.82;
  const startFrequency = direction === "up" ? 270 : direction === "down" ? 470 : 350;
  const endFrequency = direction === "up" ? 660 : direction === "down" ? 175 : 390;
  const volume = 0.055 * densityScale(maxDuration);
  const gain = ctx.createGain();

  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.linearRampToValueAtTime(volume,now + duration * 0.24);
  gain.gain.linearRampToValueAtTime(volume * 0.82,now + duration * 0.65);
  gain.gain.exponentialRampToValueAtTime(0.0001,now + duration);

  [-4,4].forEach(function(detune){
    const osc = ctx.createOscillator();
    osc.type = "sine";
    osc.detune.setValueAtTime(detune,now);
    osc.frequency.setValueAtTime(startFrequency,now);
    osc.frequency.exponentialRampToValueAtTime(endFrequency,now + duration);
    osc.connect(gain);
    osc.start(now);
    osc.stop(now + duration + 0.01);
  });
  gain.connect(ctx.destination);
}

function playMoogSound(ctx,direction,maxDuration){
  const now = ctx.currentTime;
  const baseFrequency = direction === "up" ? 440 : direction === "down" ? 130.81 : 261.63;
  const baseDuration = direction === "down" ? 0.42 : 0.34;
  const duration = typeof maxDuration === "number"
    ? Math.max(0.08,Math.min(baseDuration,maxDuration * 1.35))
    : baseDuration;
  const volume = 0.105 * densityScale(maxDuration);
  const gain = ctx.createGain();
  const filter = ctx.createBiquadFilter();

  filter.type = "lowpass";
  filter.Q.setValueAtTime(7.5,now);
  filter.frequency.setValueAtTime(direction === "down" ? 1150 : 2100,now);
  filter.frequency.exponentialRampToValueAtTime(direction === "down" ? 190 : 330,now + duration);
  gain.gain.setValueAtTime(0.0001,now);
  gain.gain.exponentialRampToValueAtTime(volume,now + 0.012);
  gain.gain.exponentialRampToValueAtTime(volume * 0.38,now + duration * 0.34);
  gain.gain.exponentialRampToValueAtTime(0.0001,now + duration);

  [{type:"sawtooth",detune:-7,level:1},{type:"triangle",detune:7,level:0.72}].forEach(function(voice){
    const osc = ctx.createOscillator();
    const voiceGain = ctx.createGain();
    osc.type = voice.type;
    osc.frequency.setValueAtTime(baseFrequency,now);
    osc.detune.setValueAtTime(voice.detune,now);
    voiceGain.gain.setValueAtTime(voice.level,now);
    osc.connect(voiceGain);
    voiceGain.connect(filter);
    osc.start(now);
    osc.stop(now + duration + 0.01);
  });
  filter.connect(gain);
  gain.connect(ctx.destination);
}

function playMoveSound(direction,maxDuration){
  if(!state.audioReady || !state.audioCtx) return;
  try{
    if(state.soundPreset === "waves") playWaveSound(state.audioCtx,direction,maxDuration);
    else if(state.soundPreset === "moog") playMoogSound(state.audioCtx,direction,maxDuration);
    else playClassicSound(state.audioCtx,direction,maxDuration);
  }catch(e){}
}

function clearSoundPreview(){
  state.soundPreviewTimers.forEach(function(timer){ clearTimeout(timer); });
  state.soundPreviewTimers = [];
  if(state.soundPreviewResumeTimer) clearTimeout(state.soundPreviewResumeTimer);
  state.soundPreviewResumeTimer = null;
}

function previewSoundPreset(){
  clearSoundPreview();
  stopMainSoundCycle();
  ["down","flat","up"].forEach(function(direction,index){
    const timer = setTimeout(function(){ playMoveSound(direction); },index * 290);
    state.soundPreviewTimers.push(timer);
  });
  state.soundPreviewResumeTimer = setTimeout(function(){
    state.soundPreviewTimers = [];
    state.soundPreviewResumeTimer = null;
    startMainSoundCycle();
  },1120);
}

function selectSoundPreset(preset){
  if(!SOUND_PRESETS[preset]) return;
  state.soundPreset = preset;
  try{ localStorage.setItem(SOUND_STORAGE_KEY,preset); }catch(e){}
  const audioAvailable = unlockAudio();
  render();
  if(audioAvailable) previewSoundPreset();
  showToast("Som " + SOUND_PRESETS[preset].label + " selecionado");
}

function clearSoundTimers(){
  state.soundTimers.forEach(function(timer){ clearTimeout(timer); });
  state.soundTimers = [];
}

function stopMainSoundCycle(){
  clearSoundTimers();
  if(state.soundCycleTimer) clearInterval(state.soundCycleTimer);
  state.soundCycleTimer = null;
}

function scheduleMainSounds(){
  if(detailTicker || !state.audioReady) return;
  clearSoundTimers();
  const stocks = mixedStocks();
  if(!stocks.length) return;
  const spacingMs = soundSpacingMs(stocks.length);
  stocks.forEach(function(stock,index){
    const timer = setTimeout(function(){
      playMoveSound(state.movements[stockKey(stock.marketKey,stock.ticker)] || "flat",spacingMs / 1000 * 0.78);
    }, index * spacingMs);
    state.soundTimers.push(timer);
  });
}

function startMainSoundCycle(){
  if(detailTicker || !state.audioReady || state.soundCycleTimer || !selectedMarketKeys().length) return;
  scheduleMainSounds();
  state.soundCycleTimer = setInterval(scheduleMainSounds,SOUND_CYCLE_MS);
}

function restartMainSoundCycle(){
  stopMainSoundCycle();
  startMainSoundCycle();
}

function money(v,marketKey){
  if(v == null || isNaN(v)) return "—";
  return MARKETS[marketKey].currencySymbol + " " + Number(v).toLocaleString("pt-BR",{minimumFractionDigits:2,maximumFractionDigits:4});
}

function render(){
  const searchBox = document.querySelector(".search");
  const nav = document.querySelector(".nav");
  const mainSoundHint = document.getElementById("mainSoundHint");
  const marketTabs = document.getElementById("marketTabs");
  const pageTitle = document.getElementById("pageTitle");
  const foot = document.getElementById("foot");
  const market = currentMarket();
  const selectedKeys = selectedMarketKeys();
  const stocks = detailTicker
    ? market.stocks.map(function(stock){ return {ticker:stock.ticker,name:stock.name,marketKey:state.market}; })
    : mixedStocks(selectedKeys);

  document.querySelectorAll("[data-sound-preset]").forEach(function(btn){
    const active = btn.getAttribute("data-sound-preset") === state.soundPreset;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-pressed",active ? "true" : "false");
  });

  if(detailTicker){
    pageTitle.textContent = market.title;
    if(foot) foot.textContent = "Dados públicos de mercado da " + market.description + "; podem ter atraso em relação ao pregão. Esta tela atualiza automaticamente a cada 10 segundos.";
  }else if(selectedKeys.length === 1){
    const onlyMarket = MARKETS[selectedKeys[0]];
    pageTitle.textContent = onlyMarket.title;
    document.title = onlyMarket.title;
    if(foot) foot.textContent = "Dados públicos de mercado da " + onlyMarket.description + "; podem ter atraso em relação ao pregão. Esta tela atualiza automaticamente a cada 10 segundos.";
  }else if(selectedKeys.length > 1){
    pageTitle.textContent = "Ações — " + selectedKeys.length + " bolsas";
    document.title = selectedKeys.length + " bolsas — ações misturadas";
    if(foot) foot.textContent = "Dados públicos de " + selectedKeys.map(function(key){ return MARKETS[key].label; }).join(", ") + "; podem ter atraso em relação ao pregão. Esta tela atualiza automaticamente a cada 10 segundos.";
  }else{
    pageTitle.textContent = "Escolha as bolsas";
    document.title = "Escolha as bolsas";
    if(foot) foot.textContent = "Selecione uma ou mais bolsas para misturar as ações e os sons.";
  }

  document.querySelectorAll("[data-market]").forEach(function(btn){
    const active = selectedKeys.indexOf(btn.getAttribute("data-market")) !== -1;
    btn.classList.toggle("active",active);
    btn.setAttribute("aria-pressed",active ? "true" : "false");
  });

  if(detailTicker){
    const s = market.stocks.find(function(item){ return item.ticker === detailTicker; });
    if(!s){
      list.innerHTML = '<div style="padding:42px 0;color:#8b8f96">Ação não encontrada.</div>';
      if(searchBox) searchBox.style.display = "none";
      return;
    }

    if(searchBox) searchBox.style.display = "none";
    if(nav) nav.style.display = "none";
    if(mainSoundHint) mainSoundHint.style.display = "none";
    if(marketTabs) marketTabs.style.display = "none";

    const key = stockKey(state.market,s.ticker);
    const q = state.quotes[key];
    let move = "flat";
    let symbol = "–";
    const previous = state.previous[key];
    if(q && q.ok && typeof previous === "number"){
      if(q.price > previous){ move = "up"; symbol = "▲"; }
      else if(q.price < previous){ move = "down"; symbol = "▼"; }
    }

    document.title = s.name + " — " + market.title;
    list.innerHTML =
      '<button class="detailBack" id="detailBack">← Voltar para ações</button>' +
      '<div class="detailCard">' +
        '<div class="detailName">'+s.name+'</div>' +
        '<div class="detailTicker">'+s.ticker+' · '+market.exchange+'</div>' +
        '<div class="detailPrice '+(!q?"loading":(!q.ok?"error":""))+'">' +
          (!q?"…":(!q.ok?"indisponível":money(q.price,state.market)+' <span class="move '+move+'">'+symbol+'</span>')) +
        '</div>' +
        '<div class="soundHint '+(state.audioReady?"active":"")+'" id="soundHint">' +
          (state.audioReady ? '🔊 Som '+SOUND_PRESETS[state.soundPreset].label+' ativado' : '🔊 Toque aqui uma vez para ativar os sons') +
        '</div>' +
        '<div class="detailMeta">Atualização automática a cada 10 segundos.<br>Dados públicos de mercado da '+market.exchange+'; podem ter atraso.</div>' +
      '</div>';

    const back = document.getElementById("detailBack");
    if(back) back.addEventListener("click",function(){
      const backKeys = selectedMarketKeys();
      const anchor = backKeys[0] || state.market;
      location.href = MARKETS[anchor].basePath + selectionSuffix(backKeys);
    });
    const hint = document.getElementById("soundHint");
    if(hint) hint.addEventListener("click",unlockAudio);
    return;
  }

  if(searchBox) searchBox.style.display = "";
  if(nav) nav.style.display = "";
  if(marketTabs) marketTabs.style.display = "grid";
  if(mainSoundHint){
    mainSoundHint.style.display = "";
    mainSoundHint.className = "mainSoundHint" + (state.audioReady ? " active" : "");
    const totalStocks = stocks.length;
    const soundsPerSecond = totalStocks / (SOUND_CYCLE_MS / 1000);
    if(!selectedKeys.length){
      mainSoundHint.textContent = "Escolha uma ou mais bolsas acima";
    }else if(state.audioReady && selectedKeys.length === 1){
      mainSoundHint.textContent = "🔊 " + SOUND_PRESETS[state.soundPreset].label + " ativado — " + MARKETS[selectedKeys[0]].label + ": " + totalStocks + " ações, " + soundsPerSecond + " por segundo, ciclo de 10s";
    }else if(state.audioReady){
      mainSoundHint.textContent = "🔊 " + SOUND_PRESETS[state.soundPreset].label + " ativado — " + selectedKeys.length + " bolsas, " + totalStocks + " ações, " + soundsPerSecond + " por segundo, ciclo de 10s";
    }else{
      mainSoundHint.textContent = "🔊 Toque aqui uma vez para ativar os sons das " + totalStocks + " ações";
    }
  }
  const f = state.filter.trim().toLowerCase();
  const visible = stocks.filter(function(s){
    if(state.tab === "favoritos"){
      const fav = JSON.parse(localStorage.getItem(favoriteKey(s.marketKey)) || "[]");
      if(fav.indexOf(s.ticker) === -1) return false;
    }
    return !f || s.name.toLowerCase().includes(f) || s.ticker.toLowerCase().includes(f) || MARKETS[s.marketKey].label.toLowerCase().includes(f);
  });

  list.innerHTML = "";
  if(!visible.length){
    list.innerHTML = '<div style="padding:42px 0;color:#8b8f96;text-align:center">'+(selectedKeys.length ? 'Nenhuma ação aqui.' : 'Selecione uma ou mais bolsas acima.')+'</div>';
    return;
  }

  visible.forEach(function(s){
    const marketForStock = MARKETS[s.marketKey];
    const key = stockKey(s.marketKey,s.ticker);
    const q = state.quotes[key];
    const row = document.createElement("div");
    row.className = "row";
    row.dataset.marketKey = s.marketKey;
    row.dataset.ticker = s.ticker;
    let move = "flat";
    let symbol = "–";
    if(q && q.ok){
      const previous = state.previous[key];
      if(typeof previous === "number"){
        if(q.price > previous){ move = "up"; symbol = "▲"; }
        else if(q.price < previous){ move = "down"; symbol = "▼"; }
      }
    }
    row.innerHTML =
      '<div><div class="name">'+s.name+'</div><div class="ticker">'+s.ticker+' · '+marketForStock.label+'</div></div>' +
      '<div class="price '+(!q?"loading":(!q.ok?"error":""))+'">'+
        (!q?"…":(!q.ok?"indisponível":money(q.price,s.marketKey)+' <span class="move '+move+'">'+symbol+'</span>'))+
      '</div>';
    row.addEventListener("click",function(){
      location.href = marketForStock.basePath + "/" + s.ticker + selectionSuffix(selectedKeys);
    });
    row.addEventListener("contextmenu",function(e){
      e.preventDefault();
      toggleFav(s.marketKey,s.ticker);
    });
    list.appendChild(row);
  });
}
function favoriteKey(marketKey){
  if(marketKey === "tokyo") return "nz-favs";
  if(marketKey === "bovespa") return "bovespa-favs";
  return marketKey + "-favs";
}
function toggleFav(marketKey,ticker){
  const key = favoriteKey(marketKey);
  let fav = JSON.parse(localStorage.getItem(key) || "[]");
  const i = fav.indexOf(ticker);
  if(i >= 0){ fav.splice(i,1); showToast("Removido dos favoritos"); }
  else { fav.push(ticker); showToast("Adicionado aos favoritos"); }
  localStorage.setItem(key,JSON.stringify(fav));
  render();
}

function toggleMarket(key,updateUrl){
  if(!MARKETS[key] || detailTicker) return;
  const selected = selectedMarketKeys();
  const index = selected.indexOf(key);
  if(index === -1) selected.push(key);
  else selected.splice(index,1);
  state.selectedMarkets = MARKET_KEYS.filter(function(marketKey){ return selected.indexOf(marketKey) !== -1; });
  state.market = state.selectedMarkets[0] || key;
  state.requestSerial += 1;
  if(updateUrl !== false) updateSelectionUrl();
  restartMainSoundCycle();
  render();
  refresh();
}

async function refresh(){
  const marketKeys = detailTicker ? [state.market] : selectedMarketKeys();
  const requestId = ++state.requestSerial;
  if(!marketKeys.length){
    updated.textContent = "nenhuma bolsa selecionada";
    document.getElementById("refresh").disabled = false;
    render();
    return;
  }
  updated.textContent = "atualizando...";
  const button = document.getElementById("refresh");
  button.disabled = true;
  try{
    const results = await Promise.all(marketKeys.map(async function(marketKey){
      try{
        const res = await fetch(MARKETS[marketKey].api,{cache:"no-store"});
        if(!res.ok) throw new Error("Falha na fonte");
        const data = await res.json();
        if(!Array.isArray(data.quotes)) throw new Error("Resposta inválida");
        if(data.marketKey && data.marketKey !== marketKey) throw new Error("Mercado incorreto");
        return {ok:true,marketKey:marketKey,data:data};
      }catch(error){
        return {ok:false,marketKey:marketKey,error:error};
      }
    }));
    if(requestId !== state.requestSerial) return;

    let successfulMarkets = 0;
    let latestFetchedAt = 0;
    results.forEach(function(result){
      if(!result.ok) return;
      successfulMarkets += 1;
      latestFetchedAt = Math.max(latestFetchedAt,new Date(result.data.fetchedAt || Date.now()).getTime());
      result.data.quotes.forEach(function(q){
        const key = stockKey(result.marketKey,q.ticker);
        const current = state.quotes[key];
        let movement = "flat";
        if(current && current.ok && typeof current.price === "number"){
          state.previous[key] = current.price;
          if(q.ok && typeof q.price === "number"){
            if(q.price > current.price) movement = "up";
            else if(q.price < current.price) movement = "down";
          }
        }
        state.movements[key] = movement;
        if(detailTicker === q.ticker && state.market === result.marketKey && current && current.ok && q.ok && typeof q.price === "number"){
          playMoveSound(movement);
        }
        state.quotes[key] = q;
      });
    });
    if(!successfulMarkets) throw new Error("Fontes indisponíveis");
    const now = new Date(latestFetchedAt || Date.now());
    const time = now.toLocaleTimeString("pt-BR",{hour:"2-digit",minute:"2-digit",second:"2-digit"});
    updated.textContent = successfulMarkets === marketKeys.length
      ? "consultado às " + time
      : successfulMarkets + " de " + marketKeys.length + " bolsas consultadas às " + time;
  }catch(e){
    if(requestId === state.requestSerial){
      updated.textContent = "fonte temporariamente indisponível";
    }
  }finally{
    if(requestId === state.requestSerial){
      button.disabled = false;
      render();
    }
  }
}

document.getElementById("search").addEventListener("input",function(e){
  state.filter = e.target.value;
  render();
});
document.getElementById("refresh").addEventListener("click",refresh);
const mainSoundHint = document.getElementById("mainSoundHint");
if(mainSoundHint) mainSoundHint.addEventListener("click",unlockAudio);

document.querySelectorAll("[data-sound-preset]").forEach(function(btn){
  btn.addEventListener("click",function(){
    selectSoundPreset(btn.getAttribute("data-sound-preset"));
  });
});

document.querySelectorAll("[data-market]").forEach(function(btn){
  btn.addEventListener("click",function(){
    toggleMarket(btn.getAttribute("data-market"),true);
  });
});

window.addEventListener("popstate",function(){
  const path = location.pathname.split("/").filter(Boolean)[0];
  const key = PATH_MARKETS[path] || "tokyo";
  state.market = key;
  state.selectedMarkets = selectionFromUrl(key);
  if(state.selectedMarkets.length) state.market = state.selectedMarkets[0];
  state.requestSerial += 1;
  restartMainSoundCycle();
  render();
  refresh();
});

document.querySelectorAll(".nav button").forEach(function(btn){
  btn.addEventListener("click",function(){
    document.querySelectorAll(".nav button").forEach(function(b){b.classList.remove("active")});
    btn.classList.add("active");
    state.tab = btn.getAttribute("data-tab");
    if(state.tab === "config"){
      showToast("Atualização automática a cada 10s");
      state.tab = "inicio";
      document.querySelector('[data-tab="inicio"]').classList.add("active");
      btn.classList.remove("active");
    }
    render();
  });
});

render();
refresh();
document.addEventListener("pointerdown",function firstAudioGesture(event){
  if(event.target.closest("[data-market],[data-sound-preset]")) return;
  unlockAudio();
  document.removeEventListener("pointerdown",firstAudioGesture);
});
setInterval(refresh,SOUND_CYCLE_MS);
</script>
